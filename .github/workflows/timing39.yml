name: 39 Mode model regressions
on:
  push:
    branches: ['codex/39-mode']
  pull_request:
  workflow_dispatch:
jobs:
  model:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y libboost-dev libgtest-dev
      - name: Compile portable model in CI
        run: >-
          g++ -std=c++17 -Wall -Wextra -Wpedantic -g
          -fsanitize=address,undefined -fno-omit-frame-pointer
          -Ilibaegisub/include -Isrc libaegisub/common/timing39_reading.cpp
          libaegisub/common/timing39_match.cpp libaegisub/common/timing39_session.cpp
          tests/tests/timing39.cpp tests/tests/timing39_session.cpp
          -lgtest_main -lgtest -pthread -o timing39-tests
      - name: Exercise language, real lyrics, capture and assignment corrections
        run: ./timing39-tests --gtest_output=xml:timing39-results.xml
      - name: Annotate failing model assertions
        if: failure()
        run: |
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          path = "timing39-results.xml"
          if os.path.isfile(path):
              for case in ET.parse(path).getroot().iter("testcase"):
                  for failure in case.findall("failure"):
                      title = f"{case.get('classname')}.{case.get('name')}"
                      message = (failure.get("message") or failure.text or "Assertion failed")[:6000]
                      message = message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                      print(f"::error title={title}::{message}")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: timing39-model-results
          path: timing39-results.xml
